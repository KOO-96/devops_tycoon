[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-tycoon-simulation"
version = "0.1.0"
description = "Deterministic MVP simulation foundation for DevOps Tycoon"
requires-python = ">=3.11"
# Runtime dependencies: NONE.
# The simulation is a pure-stdlib domain module. It must not depend on
# FastAPI, WebSocket servers, real Redis/PostgreSQL drivers, or LLM APIs.
dependencies = []

[project.optional-dependencies]
# Backend runtime deps (MVP game session API). The `simulation` package must
# NEVER import these — only the `backend` package may.
backend = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["simulation*", "backend*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["simulation", "backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom uses callables in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["simulation", "backend"]
warn_unused_ignores = true
disallow_untyped_defs = true
# Alembic migration scripts are generated DB DDL, not application code.
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
# Third-party libs without complete stubs in this environment.
module = ["asyncpg.*", "redis.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: requires real PostgreSQL/Redis (not run by default)",
]
