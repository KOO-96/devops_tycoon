# ASSET-OPS-004 — Production asset validation gate.
#
# The REQUIRED merge check-run name (used by branch protection) is EXACTLY the job
# name below: `asset-production-gate`. Do NOT rename the job without updating the
# policy, this workflow, and branch protection atomically (contract-matrix §"Validator
# interface"). This workflow only *runs* the gate; enforcement (making it a required
# check) is a separate DevCTO/Ops branch-protection action — see
# docs/operations/asset-ops-004-validator.md.
name: asset-production-gate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: asset-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-production-gate:
    name: asset-production-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint validator
        run: ruff check tools tests/asset_ops tests/assets/fixtures

      - name: Type-check validator
        run: mypy tools tests/asset_ops tests/assets/fixtures

      - name: Validator fixtures (C01-C26 positive + negative)
        run: pytest -q tests/asset_ops

      - name: Validate production assets
        # No production assets yet => 0 records => exit 0 (pass). When production
        # metadata/manifest/releases land under assets/, this step enforces C01-C26.
        run: |
          python -m tools.asset_ops validate \
            --workspace . \
            --report asset-gate-report.json

      - name: Upload validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asset-gate-report
          path: asset-gate-report.json
          if-no-files-found: ignore
